name: Publier le cours et les slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - name: Node et Marp
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @marp-team/marp-cli@4

      - name: Rendre le cours
        run: |
          ./demo-norrsken/marketplace/construire.sh
          ./cours/extraire.sh
          quarto render cours --to html

      - name: Rendre les slides
        run: |
          mkdir -p _site/slides
          marp supports/slides.md --theme-set style/theme.css --html -o _site/slides/index.html
          marp supports/slides.md --theme-set style/theme.css --allow-local-files --pdf -o _site/slides/slides.pdf
          cp -R supports/figures _site/slides/figures

      - name: Assembler le site
        run: |
          cp -R cours/_book/. _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  kit-participants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le kit
        run: |
          K=$(mktemp -d)
          mkdir -p "$K/demo-norrsken" "$K/participants"
          cp -R demo-norrsken/app demo-norrsken/support demo-norrsken/README.md "$K/demo-norrsken/"
          cp -R participants/squelettes participants/grille-declencheur-mecanisme.md participants/quiz-arbitrage.md participants/fiche-engagement.md "$K/participants/"
          cp -R tp "$K/tp"
          cp participants/README-kit.md "$K/README.md"
          printf 'node_modules/\n.env\nsupport/audit.log\n.claude/\n.mcp.json\nCLAUDE.md\n' > "$K/demo-norrsken/.gitignore"
          echo "KIT=$K" >> "$GITHUB_ENV"

      - name: Publier dans norrsken-demo
        env:
          DEPLOY_KEY: ${{ secrets.NORRSKEN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/norrsken && chmod 600 ~/.ssh/norrsken
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/norrsken -o IdentitiesOnly=yes"
          W=$(mktemp -d)
          git clone -q git@github.com:remicastaing/norrsken-demo.git "$W" || (cd "$W" && git init -q -b main && git remote add origin git@github.com:remicastaing/norrsken-demo.git)
          find "$W" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$KIT"/. "$W"/
          cd "$W"
          git config user.name "formation-claude (Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Kit inchangé."; exit 0; fi
          git commit -q -m "Mettre à jour le kit depuis formation-claude@${GITHUB_SHA::7}"
          git push -q origin HEAD:main

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
